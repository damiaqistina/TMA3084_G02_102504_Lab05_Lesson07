name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Lab A - Analyze & Test
        run: |
          cd bottom_navigator_bar_lab
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test